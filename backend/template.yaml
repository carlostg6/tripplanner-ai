AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  TripPlanner AI - Canal 1 (operaciones de negocio): Cognito, API Gateway (HTTP API),
  Lambdas, DynamoDB y hosting del frontend (S3 + CloudFront). Incluye la política IAM
  que el rol de AgentCore necesita para que las Tools del Orchestrator invoquen las Lambdas.

Parameters:
  ProjectName:
    Type: String
    Default: tripplanner
    AllowedPattern: "[a-z0-9-]+"
  DevOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Origen adicional permitido por CORS para desarrollo local (vite dev server).
  ThrottlingRate:
    Type: Number
    Default: 20
  ThrottlingBurst:
    Type: Number
    Default: 40

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        TABLE_NAME: !Ref TripPlannerTable
        LOG_LEVEL: INFO

Resources:
  # ───────────────────────────── Persistencia ─────────────────────────────
  TripPlannerTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-data"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  # ───────────────────────────── Autenticación ─────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: true
          RequireSymbols: false
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
        - { Name: name, AttributeDataType: String, Required: false, Mutable: true }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false          # cliente público: el navegador no guarda secretos
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  # ───────────────────────────── API Gateway ─────────────────────────────
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  TripPlannerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${FrontendDistribution.DomainName}"
          - !Ref DevOrigin
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottlingRate
        ThrottlingBurstLimit: !Ref ThrottlingBurst
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","route":"$context.routeKey","status":"$context.status","latency":"$context.responseLatency","sub":"$context.authorizer.claims.sub"}'

  # ───────────────────────────── Lambdas: Viajes ─────────────────────────────
  CreateTripFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-CreateTrip"
      Handler: handlers.trips.create_trip
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: /trips, Method: POST } }

  GetTripsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-GetTrips"
      Handler: handlers.trips.get_trips
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource:
                - !GetAtt TripPlannerTable.Arn
                - !Sub "${TripPlannerTable.Arn}/index/GSI1"
      Events:
        List: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: /trips, Method: GET } }
        Detail: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: "/trips/{tripId}", Method: GET } }

  UpdateTripFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-UpdateTrip"
      Handler: handlers.trips.update_trip
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: "/trips/{tripId}", Method: PUT } }

  # ───────────────────────────── Lambdas: Itinerarios ─────────────────────────────
  CreateItineraryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-CreateItinerary"
      Handler: handlers.itineraries.create_itinerary
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: "/trips/{tripId}/itinerary", Method: POST } }

  GetItineraryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-GetItinerary"
      Handler: handlers.itineraries.get_itinerary
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: "/trips/{tripId}/itinerary", Method: GET } }

  UpdateItineraryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-UpdateItinerary"
      Handler: handlers.itineraries.update_itinerary
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: "/trips/{tripId}/itinerary", Method: PUT } }

  # ───────────────────────────── Lambdas: Reservas ─────────────────────────────
  CreateReservationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-CreateReservation"
      Handler: handlers.reservations.create_reservation
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: /reservations, Method: POST } }

  GetReservationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-GetReservations"
      Handler: handlers.reservations.get_reservations
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource:
                - !GetAtt TripPlannerTable.Arn
                - !Sub "${TripPlannerTable.Arn}/index/GSI1"
      Events:
        List: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: /reservations, Method: GET } }
        Detail: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: "/reservations/{reservationId}", Method: GET } }

  UpdateReservationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-UpdateReservation"
      Handler: handlers.reservations.update_reservation
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: "/reservations/{reservationId}", Method: PUT } }

  DeleteReservationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-DeleteReservation"
      Handler: handlers.reservations.delete_reservation
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:DeleteItem]
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: "/reservations/{reservationId}", Method: DELETE } }

  # ───────────────────────────── Lambdas: Usuario y preferencias ─────────────────────────────
  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-GetProfile"
      Handler: handlers.users.get_profile
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: /me, Method: GET } }

  UpdateProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-UpdateProfile"
      Handler: handlers.users.update_profile
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: /me, Method: PUT } }

  GetPreferencesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-GetPreferences"
      Handler: handlers.users.get_preferences
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: /preferences, Method: GET } }

  PutPreferencesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-SavePreferences"
      Handler: handlers.users.put_preferences
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref TripPlannerApi, Path: /preferences, Method: PUT } }

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-PostConfirmation"
      Handler: handlers.users.post_confirmation
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        Cognito:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostConfirmation

  # ───────────────────────────── Permiso para AgentCore ─────────────────────────────
  # Adjuntar esta política al rol de ejecución del AgentCore Runtime (ver docs/DESPLIEGUE.md).
  # Permite SOLO invocar las Lambdas que respaldan las Tools; nada de acceso a DynamoDB.
  AgentToolsInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-agent-tools-invoke"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource:
              - !GetAtt CreateTripFunction.Arn
              - !GetAtt GetTripsFunction.Arn
              - !GetAtt UpdateTripFunction.Arn
              - !GetAtt CreateItineraryFunction.Arn
              - !GetAtt UpdateItineraryFunction.Arn
              - !GetAtt CreateReservationFunction.Arn
              - !GetAtt GetReservationsFunction.Arn
              - !GetAtt UpdateReservationFunction.Arn
              - !GetAtt DeleteReservationFunction.Arn
              - !GetAtt GetPreferencesFunction.Arn
              - !GetAtt PutPreferencesFunction.Arn

  # ───────────────────────────── Frontend (S3 privado + CloudFront OAC) ─────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: TripPlanner AI frontend
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: s3-frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          # Canal 2: el navegador llama al endpoint HTTP streaming de AgentCore a través del
          # MISMO dominio del frontend (sin API Gateway). Evita CORS y no transforma el stream.
          - Id: agentcore-runtime
            DomainName: !Sub "bedrock-agentcore.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
        CacheBehaviors:
          - PathPattern: /runtimes/*
            TargetOriginId: agentcore-runtime
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
            Compress: false
        DefaultCacheBehavior:
          TargetOriginId: s3-frontend
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          Compress: true
        # Sin CustomErrorResponses: el frontend usa HashRouter, y así los errores 401/403
        # de AgentCore en /runtimes/* llegan intactos al navegador.

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  ApiUrl:
    Value: !Sub "https://${TripPlannerApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDiscoveryUrl:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration"
  TableName:
    Value: !Ref TripPlannerTable
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendUrl:
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  AgentToolsInvokePolicyArn:
    Value: !Ref AgentToolsInvokePolicy
  ToolFunctionNames:
    Description: Nombres para las variables de entorno del agente
    Value: !Sub "CreateTrip=${CreateTripFunction},GetTrips=${GetTripsFunction},UpdateTrip=${UpdateTripFunction},CreateItinerary=${CreateItineraryFunction},UpdateItinerary=${UpdateItineraryFunction},CreateReservation=${CreateReservationFunction},GetReservations=${GetReservationsFunction},UpdateReservation=${UpdateReservationFunction},DeleteReservation=${DeleteReservationFunction},GetPreferences=${GetPreferencesFunction},SavePreferences=${PutPreferencesFunction}"
